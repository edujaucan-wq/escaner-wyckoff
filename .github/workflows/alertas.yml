name: Alertas Wyckoff Automáticas

on:
  schedule:
    # Se ejecuta cada hora de lunes a viernes
    - cron: '0 * * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ejecutar-alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alertas.py
